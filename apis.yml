description: GeoCat bv is a Dutch company built around the open-source geospatial stack, and is the primary maintainer
  of GeoNetwork, the catalogue software that runs a large share of Europe's INSPIRE metadata infrastructure. It
  sells GeoCat Bridge, GeoCat Live and hosted catalogue services, and runs a public demonstration estate serving
  both classic OGC web services and a modern OGC API - Features endpoint.
